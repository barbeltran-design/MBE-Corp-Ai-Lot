name: Sync convocatorias (domingo)

on:
  schedule:
    # Cada domingo 08:00 UTC (02:00-03:00 CDMX) — busca candidatas con Gemini,
    # las inserta en la hoja (si SHEETS_WEB_APP_URL está configurado) y luego
    # sincroniza la hoja con src/lib/convocatorias-data.json.
    - cron: '0 8 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  busqueda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar candidatas con Gemini
        id: buscar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEETS_WEB_APP_URL: ${{ secrets.SHEETS_WEB_APP_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LIMITE_CANDIDATAS: ${{ vars.LIMITE_CANDIDATAS }}
        # Sin secretos GEMINI_API_KEY/SHEETS_WEB_APP_URL este paso se hace skip
        # y solo queda el sync básico, que no necesita llaves.
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY no configurado; se omite la busqueda semanal."
            exit 0
          fi
          if [ -z "$SHEETS_WEB_APP_URL" ]; then
            echo "SHEETS_WEB_APP_URL no configurado; la busqueda solo imprime candidatas (sin insertar)."
          fi
          node scripts/buscar-convocatorias.mjs --insertar || exit $?

  sync:
    needs: busqueda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar sync con la hoja de Google Sheets
        # Si el script aborta (p.ej. la guarda anti-caida de registros), este
        # paso falla con exit != 0 y GitHub Actions NO ejecuta los pasos
        # siguientes (commit/PR) automaticamente: nada se toca en el repo.
        run: node scripts/sync-convocatorias.mjs

      - name: Crear Pull Request si hubo cambios
        # Ya no se hace push directo a main. Los cambios detectados por el
        # sync se proponen como PR para que alguien los revise antes de
        # que lleguen a main (segunda capa de seguridad ademas de la guarda
        # del 20% en el script).
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Convocatorias y fondos: sync semanal automatico con la hoja de Google (fuente canonica)"
          title: "Sync semanal de convocatorias (revision requerida)"
          body: |
            Actualizacion automatica de `src/lib/convocatorias-data.json` generada por el
            sync semanal con la hoja de Google Sheets (fuente canonica).

            Revisa el diff antes de aprobar el merge a `main`: confirma que el numero de
            registros tiene sentido y que no se perdieron convocatorias inesperadamente.
          branch: sync/convocatorias-automatico
          delete-branch: true
          add-paths: src/lib/convocatorias-data.json